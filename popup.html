<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><h1>LinkedIn AI Filter</h1></header>
  <main>
    <label class="row">
      <span>Filter enabled</span>
      <input type="checkbox" id="enabled">
    </label>

    <div class="row col">
      <span>Sensitivity — threshold: <b id="thresholdValue">4</b></span>
      <input type="range" id="threshold" min="1" max="10" step="0.5">
      <small>Lower = more aggressive (more posts flagged)</small>
    </div>

    <fieldset>
      <legend>Action on flagged posts</legend>
      <label><input type="radio" name="mode" value="hide"> Hide completely</label>
      <label><input type="radio" name="mode" value="blur"> Blur (hover to reveal)</label>
    </fieldset>

    <label class="row">
      <span>Show "Likely AI" badge</span>
      <input type="checkbox" id="showBadge">
    </label>

    <div class="stats">
      <div><b id="scanned">0</b><span>scanned</span></div>
      <div><b id="flagged">0</b><span>flagged</span></div>
    </div>

    <p class="footer">
      Detection is heuristic — false positives and negatives happen.
      Click "Show anyway" on any post to override.
    </p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
